<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0f">
    <title>محرر الصور - Photo Editor Pro</title>
    <link rel="stylesheet" href="/css/editor.css">
</head>

<body>

<header class="editor-header">
    <div class="editor-header-side">
        <button class="back-button" onclick="history.back()" aria-label="رجوع">
            →
        </button>
    </div>

    <div class="editor-title">
        <strong>محرر الصور</strong>
        <span>Photo Editor Pro</span>
    </div>

    <div class="editor-header-actions">
        <button class="header-action" id="undoButton" disabled title="تراجع">
            ↶
        </button>

        <button class="header-action" id="redoButton" disabled title="إعادة">
            ↷
        </button>

        <button class="save-button" id="exportButton" disabled>
            تصدير
        </button>
    </div>
</header>


<main class="editor-container">

    <section class="canvas-area">

        <div class="workspace-toolbar" id="workspaceToolbar">
            <button type="button" id="zoomOutButton" disabled>−</button>
            <span id="zoomValue">100%</span>
            <button type="button" id="zoomInButton" disabled>+</button>
            <button type="button" id="fitButton" disabled>ملاءمة</button>
        </div>

        <div class="empty-editor" id="emptyEditor">

            <div class="empty-editor-icon">🖼️</div>

            <h2>ابدأ بتعديل صورة</h2>

            <p>اختر صورة من جهازك لفتحها داخل المحرر</p>

            <button class="select-image-button" id="selectImageButton">
                اختيار صورة
            </button>

        </div>


        <div class="image-workspace" id="imageWorkspace" hidden>

            <div class="image-container">
                <canvas id="editorCanvas"></canvas>
            </div>

        </div>

    </section>


    <section class="editor-tools">

        <button class="editor-tool" id="cropButton">
            <span>✂️</span>
            <strong>قص</strong>
        </button>

        <button class="editor-tool" id="rotateButton" disabled>
            <span>🔄</span>
            <strong>تدوير</strong>
        </button>

        <button class="editor-tool" id="brightnessButton" disabled>
            <span>☀️</span>
            <strong>إضاءة</strong>
        </button>

        <button class="editor-tool" id="contrastButton" disabled>
            <span>◐</span>
            <strong>تباين</strong>
        </button>

        <button class="editor-tool" id="filterButton" disabled>
            <span>🎨</span>
            <strong>فلاتر</strong>
        </button>

        <button class="editor-tool" id="addTextButton">
            <span>🔤</span>
            <strong>نص</strong>
        </button>

        <button class="editor-tool" disabled>
            <span>🏷️</span>
            <strong>شعار</strong>
        </button>

    </section>

</main>
<section class="timeline-panel" id="timelinePanel">
    <div class="timeline-header">
        <strong>Timeline</strong>
        <span id="timelineDuration">00:00</span>
    </div>

    <div class="timeline-ruler" id="timelineRuler"></div>

    <div class="timeline-tracks" id="timelineTracks">
        <div class="timeline-empty" id="timelineEmpty">
            أضف عناصر للمشروع لتظهر هنا
        </div>
    </div>
</section>


<script src="/js/image-editor.js"></script>

</body>
</html>
